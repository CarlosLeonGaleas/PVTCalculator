<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" fill="none">
  <rect width="400" height="240" rx="16" fill="url(#rockBg)" />
  <!-- Strata / Rock Matrix Illustration -->
  <g opacity="0.85">
    <path d="M 0 160 Q 100 130 200 170 T 400 140 L 400 240 L 0 240 Z" fill="#78350f" opacity="0.6" />
    <path d="M 0 185 Q 120 170 240 195 T 400 180 L 400 240 L 0 240 Z" fill="#451a03" opacity="0.8" />
    <!-- Porous Grain circles -->
    <circle cx="80" cy="190" r="14" fill="#d97706" opacity="0.7" />
    <circle cx="120" cy="205" r="18" fill="#b45309" opacity="0.7" />
    <circle cx="170" cy="185" r="12" fill="#d97706" opacity="0.7" />
    <circle cx="230" cy="210" r="16" fill="#b45309" opacity="0.7" />
    <circle cx="290" cy="195" r="15" fill="#d97706" opacity="0.7" />
    <circle cx="340" cy="205" r="13" fill="#b45309" opacity="0.7" />
  </g>

  <!-- Compression Diagram / Newman Curve Overlay -->
  <g transform="translate(40, 25)">
    <rect x="0" y="0" width="320" height="120" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Grid lines -->
    <line x1="20" y1="30" x2="300" y2="30" stroke="#334155" stroke-dasharray="4 4" />
    <line x1="20" y1="60" x2="300" y2="60" stroke="#334155" stroke-dasharray="4 4" />
    <line x1="20" y1="90" x2="300" y2="90" stroke="#334155" stroke-dasharray="4 4" />
    <!-- Newman curve -->
    <path d="M 30 100 Q 120 85 200 45 T 290 20" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" />
    <!-- Data points -->
    <circle cx="30" cy="100" r="5" fill="#f59e0b" />
    <circle cx="110" cy="88" r="5" fill="#f59e0b" />
    <circle cx="190" cy="50" r="5" fill="#f59e0b" />
    <circle cx="290" cy="20" r="5" fill="#f59e0b" />
    <text x="240" y="40" font-family="sans-ui, sans-serif" font-weight="700" font-size="11" fill="#fef08a">Cf (Newman)</text>
  </g>

  <defs>
    <linearGradient id="rockBg" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b" />
      <stop offset="1" stop-color="#451a03" />
    </linearGradient>
  </defs>
</svg>
