<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" fill="none">
  <rect width="400" height="240" rx="16" fill="url(#waterBg)" />
  
  <!-- Saline Brine Molecules & Salinity Crystal Concept -->
  <g transform="translate(30, 25)">
    <!-- Water wave container -->
    <path d="M 0 100 Q 50 80 100 100 T 200 100 L 200 190 Q 200 200 190 200 L 10 200 Q 0 200 0 190 Z" fill="url(#brineGrad)" opacity="0.85" />
    <!-- NaCl Salt crystals -->
    <rect x="35" y="125" width="22" height="22" rx="4" fill="#ffffff" opacity="0.9" stroke="#93c5fd" stroke-width="2" transform="rotate(15 46 136)" />
    <rect x="95" y="140" width="26" height="26" rx="4" fill="#ffffff" opacity="0.9" stroke="#93c5fd" stroke-width="2" transform="rotate(-25 108 153)" />
    <rect x="145" y="115" width="18" height="18" rx="3" fill="#ffffff" opacity="0.9" stroke="#93c5fd" stroke-width="2" transform="rotate(40 154 124)" />
    <text x="25" y="180" font-family="sans-serif" font-weight="900" font-size="13" fill="#0f172a">HIGH SALINITY BRINE</text>
  </g>

  <!-- Osif Cw vs Salinity / Pressure Chart Overlay -->
  <g transform="translate(180, 25)">
    <rect x="0" y="0" width="195" height="180" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1.5" />
    <line x1="20" y1="45" x2="175" y2="45" stroke="#1e293b" />
    <line x1="20" y1="90" x2="175" y2="90" stroke="#1e293b" />
    <line x1="20" y1="135" x2="175" y2="135" stroke="#1e293b" />
    
    <!-- Osif 1988 Compressibility Curves -->
    <path d="M 25 50 Q 80 80 170 120" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
    <path d="M 25 75 Q 80 110 170 150" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5 3" />
    
    <text x="25" y="30" font-family="sans-serif" font-weight="800" font-size="11" fill="#93c5fd">Cw (Osif Correlation, 1988)</text>
    <text x="95" y="70" font-family="sans-serif" font-weight="700" font-size="10" fill="#60a5fa">S = 100,000 ppm</text>
    <text x="95" y="105" font-family="sans-serif" font-weight="700" font-size="10" fill="#38bdf8">S = 200,000 ppm</text>
  </g>

  <defs>
    <linearGradient id="waterBg" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="brineGrad" x1="0" y1="100" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
</svg>
