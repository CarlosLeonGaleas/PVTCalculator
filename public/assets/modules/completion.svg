<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" fill="none">
  <rect width="400" height="240" rx="16" fill="url(#completionBg)" />
  
  <!-- Hydrostatic Wellbore Column & Fluids Diagram -->
  <g transform="translate(30, 20)">
    <!-- Well casing outer -->
    <rect x="30" y="10" width="80" height="180" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
    <!-- Completion Tubing -->
    <rect x="55" y="10" width="30" height="150" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Annulus Fluid (Completion Brine) -->
    <rect x="32" y="50" width="22" height="138" fill="#0ea5e9" opacity="0.7" />
    <rect x="86" y="50" width="22" height="138" fill="#0ea5e9" opacity="0.7" />
    
    <!-- Packer Icon -->
    <rect x="32" y="140" width="22" height="14" fill="#ef4444" rx="2" />
    <rect x="86" y="140" width="22" height="14" fill="#ef4444" rx="2" />
    <text x="40" y="198" font-family="sans-serif" font-weight="800" font-size="10" fill="#38bdf8">WELLBORE</text>
  </g>

  <!-- Hydrostatic Pressure Equations / Workover Metrics -->
  <g transform="translate(160, 25)">
    <rect x="0" y="0" width="215" height="175" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="20" y="32" font-family="sans-serif" font-weight="900" font-size="13" fill="#38bdf8">HIDROSTÁTICA &amp; FLUIDOS</text>
    <line x1="20" y1="42" x2="195" y2="42" stroke="#0284c7" />

    <text x="20" y="68" font-family="sans-serif" font-weight="700" font-size="12" fill="#f8fafc">Ph = 0.052 × MW × TVD</text>
    <rect x="20" y="80" width="175" height="35" rx="6" fill="#1e293b" />
    <text x="30" y="102" font-family="sans-serif" font-weight="700" font-size="11" fill="#34d399">MW: Mud Weight (ppg)</text>
    
    <rect x="20" y="125" width="175" height="35" rx="6" fill="#1e293b" />
    <text x="30" y="147" font-family="sans-serif" font-weight="700" font-size="11" fill="#facc15">TVD: True Vertical Depth (ft)</text>
  </g>

  <defs>
    <linearGradient id="completionBg" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a" />
      <stop offset="1" stop-color="#0c4a6e" />
    </linearGradient>
  </defs>
</svg>
