<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <rect width="180" height="180" rx="20" fill="url(#bg2)" />
  <rect x="2" y="2" width="176" height="176" rx="18" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" />
  
  <g transform="translate(40, 30)">
    <!-- Atom / Molecule / Research symbol -->
    <ellipse cx="50" cy="50" rx="42" ry="16" fill="none" stroke="#38bdf8" stroke-width="2.5" transform="rotate(30 50 50)" />
    <ellipse cx="50" cy="50" rx="42" ry="16" fill="none" stroke="#818cf8" stroke-width="2.5" transform="rotate(-30 50 50)" />
    <ellipse cx="50" cy="50" rx="42" ry="16" fill="none" stroke="#34d399" stroke-width="2.5" transform="rotate(90 50 50)" />
    <circle cx="50" cy="50" r="10" fill="url(#coreGrad)" />
  </g>

  <text x="90" y="145" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="1">GRUPO I+D+i</text>
  <text x="90" y="162" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">INVESTIGACIÓN 2026</text>

  <defs>
