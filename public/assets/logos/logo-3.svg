<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" fill="none">
  <rect width="320" height="180" rx="16" fill="url(#bg3)" />
  <rect x="2" y="2" width="316" height="176" rx="14" stroke="#10b981" stroke-opacity="0.3" stroke-width="2" />
  
  <g transform="translate(25, 45)">
